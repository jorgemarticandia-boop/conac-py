<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Panel · CONAC</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{--ink:#14213d;--muted:#475569;--blue:#12408a;--line:#d3dbe8}*{box-sizing:border-box}
body{margin:0;background:#f2f5fa;color:var(--ink);font:400 18px/1.6 'Atkinson Hyperlegible',Verdana,sans-serif}
main{max-width:760px;margin:auto;padding:28px 18px 60px}h1{color:#0b2a5e;font-size:1.8rem;margin:0 0 6px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
label{display:block;font-weight:700;margin:14px 0 4px}input,select,textarea{width:100%;min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
textarea{min-height:150px}button{min-height:50px;padding:0 22px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:700 1rem inherit;cursor:pointer;margin:12px 8px 0 0}
button.sec{background:#fff;color:var(--blue);border:2px solid var(--blue)}.del{background:#b4232f}
.item{border-top:1px solid var(--line);padding:12px 0}.post small{color:var(--muted)}.post h4{margin:2px 0 6px;font-size:1.2rem}.post p{white-space:pre-wrap;margin:6px 0}
.vid{aspect-ratio:16/9;margin:8px 0}.vid iframe{width:100%;height:100%;border:0;border-radius:10px}.form-link{display:inline-block;color:var(--blue);font-weight:700}
.hint{color:var(--muted);font-size:.95rem}</style></head><body><main>
<h1>Panel de administración · CONAC</h1>
<section id="login" class="box"><p>Ingresá tu correo y tu contraseña para entrar al panel.</p><label for="mail">Correo</label><input id="mail" type="email" autocomplete="email"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password"><label for="showpass" style="font-weight:400;display:flex;align-items:center;gap:10px;margin:12px 0 0"><input id="showpass" type="checkbox" style="width:24px;height:24px;min-height:0;padding:0">Mostrar contraseña</label><button id="send">Ingresar</button><p id="msg" role="status"></p></section>
<section id="panel" hidden><p><b id="who"></b> <button class="sec" id="out" style="min-height:40px;margin:0 0 0 8px">Salir</button></p>
<form id="f" class="box"><h2 style="margin:0">Nueva publicación</h2>
<label for="type">¿Qué vas a publicar?</label><select id="type"></select>
<label for="title">Título</label><input id="title" required placeholder="Ej.: Informe semanal del 5 al 11 de octubre">
<label for="date">Fecha</label><input id="date" type="date" required>
<label for="text">Texto</label><textarea id="text"></textarea>
<label for="video">Enlace de video de YouTube (opcional)</label><input id="video" type="url" placeholder="https://youtu.be/...">
<label for="link">Enlace a documento PDF (opcional)</label><input id="link" type="url" placeholder="https://drive.google.com/...">
<p class="hint">Videos: subilos a YouTube como "No listado" y pegá el enlace. PDF: subilo a Google Drive con acceso por enlace.</p>
<button id="save">Publicar</button><button type="button" class="sec" id="cancel">Cancelar</button> <b id="ok" role="status"></b></form>
<h2>Publicaciones</h2><div id="list" class="box"></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,addDoc,setDoc,doc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:"AIzaSyA_VepcwCbO6NcvJEmtL-ke7e1pudH7uxU",authDomain:"conac-sitio.firebaseapp.com",projectId:"conac-sitio",storageBucket:"conac-sitio.firebasestorage.app",messagingSenderId:"799818789900",appId:"1:799818789900:web:a339bd5a892fb1d51aaa29"};
const TIPOS={coordinador:'Informe del Coordinador (semanal)',tesorero:'Informe del Tesorero (mensual)',consejero:'Informe o video del Consejero de la Caja',aviso:'Aviso o actividad'};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yt=u=>{const m=/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/.exec(u||'');return m?m[1]:''};
const okUrl=u=>/^https:\/\//.test(u||'');
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('es-PY',{day:'numeric',month:'long',year:'numeric'}):'';
const card=p=>`<article class="post"><small>${esc(TIPOS[p.type]||'')} · ${fmt(p.date)}</small><h4>${esc(p.title)}</h4>${p.text?`<p>${esc(p.text)}</p>`:''}${yt(p.video)?`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${yt(p.video)}" allowfullscreen loading="lazy" title="Video"></iframe></div>`:''}${okUrl(p.link)?`<a class="form-link" href="${esc(p.link)}" target="_blank" rel="noopener">Ver documento</a>`:''}</article>`;

const ADMIN='jorgemarticandia@gmail.com',OK=[ADMIN,'gilgongag3@hotmail.com'],F=['type','title','date','text','link','video'];
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let editing=null,isAdmin=false,on=false,docs={};
$('type').innerHTML=Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const reset=()=>{$('f').reset();editing=null;$('save').textContent='Publicar';$('date').valueAsDate=new Date()};reset();
$('showpass').onchange=()=>{$('pass').type=$('showpass').checked?'text':'password'};
const login=async()=>{const e=$('mail').value.trim().toLowerCase(),p=$('pass').value;
if(!OK.includes(e)){$('msg').textContent='Este correo no tiene acceso.';return}
if(!p){$('msg').textContent='Escribí tu contraseña.';return}
$('msg').textContent='Ingresando...';
try{await signInWithEmailAndPassword(auth,e,p);$('msg').textContent='';$('pass').value=''}
catch(x){$('msg').textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(x.code)?'Correo o contraseña incorrectos.':'No se pudo ingresar ('+x.code+').'}};
$('send').onclick=login;$('pass').onkeydown=e=>{if(e.key==='Enter')login()};
onAuthStateChanged(auth,u=>{const e=(u&&u.email||'').toLowerCase(),ok=!!u&&OK.includes(e);$('login').hidden=ok;$('panel').hidden=!ok;if(u&&!ok){signOut(auth);$('msg').textContent='Este correo no tiene acceso.';return}if(!ok)return;isAdmin=e===ADMIN;$('who').textContent=(isAdmin?'Administrador: ':'Editor: ')+e;listen()});
$('out').onclick=()=>signOut(auth);$('cancel').onclick=reset;
function listen(){if(on)return;on=true;onSnapshot(query(collection(db,'posts'),orderBy('date','desc')),s=>{docs=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));$('list').innerHTML=s.docs.map(d=>`<div class="item">${card(d.data())}<button class="sec" data-e="${d.id}">Editar</button><button class="del" data-d="${d.id}">Borrar</button></div>`).join('')||'<p>Todavía no hay publicaciones.</p>'})}
$('list').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d&&confirm('¿Borrar esta publicación?'))await deleteDoc(doc(db,'posts',b.dataset.d));if(b.dataset.e){editing=b.dataset.e;F.forEach(k=>$(k).value=docs[editing][k]||'');$('save').textContent='Guardar cambios';scrollTo(0,0)}};
$('f').onsubmit=async e=>{e.preventDefault();const p={by:auth.currentUser.email,updated:serverTimestamp()};F.forEach(k=>p[k]=$(k).value.trim());
try{editing?await setDoc(doc(db,'posts',editing),p):await addDoc(collection(db,'posts'),p);reset();$('ok').textContent='¡Listo, publicado!';setTimeout(()=>$('ok').textContent='',3500)}catch(x){$('ok').textContent='No se pudo guardar ('+x.code+')'}};
</script></body></html>
